swagger: "2.0"
info:
  version: "1.0.0"
  title: "Swagger Petstore"
host: "petstore.swagger.io"
basePath: "/v1"
schemes:
  - "http"
paths:
  /pets:
    get:
      description: "Returns all pets from the system that the user has access to"
      operationId: "findPets"
      produces:
        - "application/json"
      parameters:
        - name: "tags"
          in: "query"
          description: "tags to filter by"
          required: false
          type: "array"
          items:
            type: "string"
        - name: "limit"
          in: "query"
          description: "maximum number of results to return"
          required: false
          type: "integer"
          format: "int32"
      responses:
        "200":
          description: "pet response"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Pet"
        default:
          description: "unexpected error"
          schema:
            $ref: "#/definitions/Error"
    post:
      description: "Creates a new pet in the store"
      operationId: "addPet"
      produces:
        - "application/json"
      consumes:
        - "application/json"
      parameters:
        - name: "pet"
          in: "body"
          description: "Pet to add to the store"
          required: true
          schema:
            $ref: "#/definitions/NewPet"
      responses:
        "200":
          description: "pet response"
          schema:
            $ref: "#/definitions/Pet"
        default:
          description: "unexpected error"
          schema:
            $ref: "#/definitions/Error"
definitions:
  Pet:
    type: "object"
    required:
      - "id"
      - "name"
    properties:
      id:
        type: "integer"
        format: "int64"
      name:
        type: "string"
      tag:
        type: "string"
  NewPet:
    type: "object"
    required:
      - "name"
    properties:
      id:
        type: "integer"
        format: "int64"
      name:
        type: "string"
      tag:
        type: "string"
  Error:
    type: "object"
    required:
      - "code"
      - "message"
    properties:
      code:
        type: "integer"
        format: "int32"
      message:
        type: "string"
