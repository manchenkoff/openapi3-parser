[project]
name = "openapi3-parser"
version = "2.0.0"
description = "OpenAPI v3 parser"
readme = "readme.md"
license = { file = "license.txt" }
authors = [{ name = "Artem Manchenkov", email = "artem@manchenkoff.me" }]
requires-python = ">=3.10"
keywords = [
  "swagger",
  "python",
  "swagger-parser",
  "openapi3-parser",
  "parser",
  "openapi3",
  "swagger-api",
]
classifiers = [
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "referencing>=0.35",
    "PyYAML>=6.0",
]

[project.urls]
homepage = "https://github.com/manchenkoff/openapi3-parser"
source = "https://github.com/manchenkoff/openapi3-parser"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.1.0",
    "python-semantic-release>=10.6.1,<11",
    "ruff>=0.15.13",
    "ty>=0.0.37",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openapi_parser"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[tool.ruff.lint]
extend-select = [
  "D",      # pydocstyle
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "I",      # isort
  "ARG",    # unused arguments
  "RUF100", # unused noqa
  "TID252", # ban relative imports
  "PLR0915", # too-many-statements
]

[tool.ruff.lint.pylint]
max-statements = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG"]

[tool.ty]
# Tests use Pydantic aliases (e.g. location= instead of in=, not_schema=
# instead of not=) which ty does not resolve through Field(alias=) +
# populate_by_name=True correctly. These are false positives from the
# Pydantic-to-ty impedance mismatch.
[[tool.ty.overrides]]
include = ["tests/test_parse/**"]
[tool.ty.overrides.rules]
"unknown-argument" = "ignore"
"missing-argument" = "ignore"
"invalid-argument-type" = "ignore"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["openapi_parser"]
omit = ["tests/*"]
